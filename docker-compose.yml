# UNTESTED in the build environment. Serve behind an HTTPS reverse proxy for anything beyond local use: the server speaks plain HTTP.
services:
  nyayasahayak:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    env_file: [.env]
    environment: { HOST: "0.0.0.0", PORT: "8000", DATA_DIR: "/data" }
    volumes: ["ns-data:/data"]
    restart: unless-stopped
volumes:
  ns-data:
