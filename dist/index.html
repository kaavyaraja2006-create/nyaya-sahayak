<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>NyayaSahayak</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>:root{
  --font:'IBM Plex Sans','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  --serif:'Source Serif 4','Iowan Old Style','Palatino Linotype',Georgia,'Times New Roman',serif;
  --sb-w:244px;--top-h:54px;--r:4px;--r-lg:6px;
  --pad-row:10px;--pad-card:16px;--gap:16px;--fs:14px;
  --ease:cubic-bezier(.2,.7,.2,1);--dur:170ms;
}
[data-theme=light]{
  color-scheme:light;
  --bg:#F7F4EE;--surface:#FCFBF8;--raised:#FFFFFF;--sunken:#F0ECE3;--line:#E5E1D8;--line-2:#D3CDBF;
  --text:#111827;--text-2:#4B5261;--text-3:#7B7F89;
  --accent:#344B7A;--accent-fg:#FCFBF8;--accent-soft:rgba(52,75,122,.09);--accent-text:#2A3E69;
  --gold:#B08A3E;--gold-soft:rgba(176,138,62,.16);--gold-text:#7E6120;
  --ok:#3F6B52;--warn:#C58A28;--bad:#A94442;--info:#344B7A;--idle:#6F7480;
  --ok-soft:rgba(63,107,82,.11);--warn-soft:rgba(197,138,40,.14);--bad-soft:rgba(169,68,66,.10);--idle-soft:rgba(111,116,128,.11);
  --ok-t:#2F5640;--warn-t:#84590F;--bad-t:#8E3230;
  --hl:rgba(52,75,122,.16);--hl-line:#344B7A;--shadow:0 1px 2px rgba(17,24,39,.06),0 10px 28px rgba(17,24,39,.09);
  --paper:#FCFBF8;--paper-text:#1B2230;
}
[data-theme=dark]{
  color-scheme:dark;
  --bg:#12161C;--surface:#181D25;--raised:#1F252E;--sunken:#0F1318;--line:#2A313B;--line-2:#39424F;
  --text:#ECE7DC;--text-2:#A6A398;--text-3:#7C7A72;
  --accent:#5A74AD;--accent-fg:#F7F4EE;--accent-soft:rgba(122,146,204,.16);--accent-text:#A4B6E3;
  --gold:#C9A25A;--gold-soft:rgba(201,162,90,.18);--gold-text:#D9BB7C;
  --ok:#6FA486;--warn:#D9A04A;--bad:#C9736F;--info:#7A92CC;--idle:#8D8C86;
  --ok-soft:rgba(111,164,134,.15);--warn-soft:rgba(217,160,74,.15);--bad-soft:rgba(201,115,111,.16);--idle-soft:rgba(141,140,134,.15);
  --ok-t:#8EBFA3;--warn-t:#E3B667;--bad-t:#DE908C;
  --hl:rgba(122,146,204,.28);--hl-line:#7A92CC;--shadow:0 1px 0 rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.4);
  --paper:#1B2028;--paper-text:#E4DFD3;
}
[data-theme=night]{
  color-scheme:dark;
  --bg:#15120E;--surface:#1C1915;--raised:#221F19;--sunken:#12100C;--line:#2C2820;--line-2:#3A352B;
  --text:#D8D0C2;--text-2:#9A917F;--text-3:#756D5E;
  --accent:#B08A3E;--accent-fg:#1A140A;--accent-soft:rgba(176,138,62,.14);--accent-text:#D3AE68;
  --gold:#C99A4B;--gold-soft:rgba(201,154,75,.16);--gold-text:#D8AE68;
  --ok:#7FB08A;--warn:#C99A4B;--bad:#C4726E;--info:#C99A4B;--idle:#8F887A;
  --ok-soft:rgba(127,176,138,.13);--warn-soft:rgba(201,154,75,.13);--bad-soft:rgba(196,114,110,.14);--idle-soft:rgba(143,136,122,.13);
  --ok-t:#95C29F;--warn-t:#D8AE68;--bad-t:#D68A86;
  --hl:rgba(201,154,75,.26);--hl-line:#C99A4B;--shadow:0 1px 0 rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.4);
  --paper:#1E1B16;--paper-text:#D3CBBB;
}
[data-density=compact]{--pad-row:6px;--pad-card:12px;--gap:11px;--fs:13px}
[data-density=spacious]{--pad-row:15px;--pad-card:22px;--gap:22px;--fs:14.5px}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:400 var(--fs)/1.5 var(--font);-webkit-font-smoothing:antialiased;letter-spacing:-.003em;transition:background var(--dur) var(--ease),color var(--dur) var(--ease)}
[data-motion=reduce] *,[data-motion=reduce] *::before,[data-motion=reduce] *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}
h1,h2,h3,h4,p{margin:0}
a{color:var(--accent-text);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--hl-line);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--mono);font-size:.92em;letter-spacing:0}
.muted{color:var(--text-2)}.faint{color:var(--text-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{flex:none;vertical-align:middle}
.row{display:flex;align-items:center;gap:8px}.row.wrap{flex-wrap:wrap}.between{justify-content:space-between}.grow{flex:1;min-width:0}
.col{display:flex;flex-direction:column;gap:var(--gap)}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hide{display:none!important}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--sb-w) minmax(0,1fr);grid-template-rows:var(--top-h) minmax(0,1fr);height:100vh;height:100dvh}
.app.collapsed{--sb-w:60px}
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--surface);z-index:30}
.brand{display:flex;align-items:center;gap:9px;font-weight:650;letter-spacing:.02em;font-size:13px;color:var(--text);white-space:nowrap}
.brand:hover{text-decoration:none}
.brand-mark{width:26px;height:26px;border-radius:7px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;flex:none}
.crumbs{display:flex;align-items:center;gap:6px;color:var(--text-2);font-size:13px;min-width:0;overflow:hidden;white-space:nowrap}
.crumbs a{color:var(--text-2)}.crumbs a:hover{color:var(--text)}
.crumbs .cur{color:var(--text);font-weight:550}
.crumbs .sep{color:var(--text-3);flex:none}
.searchbtn{margin:0 auto;display:flex;align-items:center;gap:9px;width:min(400px,34vw);height:34px;padding:0 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--sunken);color:var(--text-2);font-size:13px;text-align:left}
.searchbtn:hover{border-color:var(--line-2);color:var(--text)}
.kbd{font:500 11px var(--mono);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--text-2);background:var(--surface)}
.iconbtn{position:relative;display:grid;place-items:center;width:34px;height:34px;border:1px solid transparent;border-radius:var(--r);background:none;color:var(--text-2)}
.iconbtn:hover{background:var(--raised);color:var(--text);border-color:var(--line)}
.iconbtn .dot{position:absolute;top:5px;right:4px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--warn);color:#1a1205;font:600 10px/16px var(--font);text-align:center}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;font-weight:600;font-size:12px;border:1px solid var(--line-2)}
.sidebar{border-right:1px solid var(--line);background:var(--surface);overflow-y:auto;padding:14px 10px;display:flex;flex-direction:column;gap:2px}
.navgroup{margin:14px 10px 4px;font-size:11.5px;font-weight:600;color:var(--text-3);letter-spacing:.02em}
.navgroup:first-child{margin-top:2px}
.navitem{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--r);color:var(--text-2);font-size:13.5px;position:relative;border:0;background:none;width:100%;text-align:left}
.navitem:hover{background:var(--raised);color:var(--text);text-decoration:none}
.navitem[aria-current=page]{background:var(--accent-soft);color:var(--text);font-weight:550}
.navitem[aria-current=page]::before{content:"";position:absolute;left:-10px;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.navitem .badge-n{margin-left:auto;font:500 11px var(--mono);padding:0 6px;border-radius:9px;background:var(--sunken);border:1px solid var(--line);color:var(--text-2)}
.navitem .badge-n.attn{color:var(--warn-t);border-color:var(--warn-soft);background:var(--warn-soft)}
.app.collapsed .navitem span,.app.collapsed .navgroup,.app.collapsed .navitem .badge-n,.app.collapsed .sb-case{display:none}
.app.collapsed .navitem{justify-content:center;padding:9px}
.sb-case{margin:2px 6px 8px;padding:10px;border:1px solid var(--line);border-radius:var(--r);background:var(--sunken)}
.sb-case .name{font-weight:600;font-size:13px;line-height:1.3}
.sb-foot{margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}
.main{overflow:auto;position:relative;scroll-behavior:smooth}
.page{padding:26px 32px 64px;max-width:1440px;margin:0 auto}
.page.narrow{max-width:960px}.page.wide{max-width:none}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:20px;flex-wrap:wrap}
.pagehead h1{font-size:22px;font-weight:650;letter-spacing:-.02em}
.pagehead .sub{color:var(--text-2);margin-top:3px;max-width:70ch}
.casehead{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:11px 32px;display:flex;align-items:center;gap:18px}
.casehead .cn{font-weight:650;font-size:15px;letter-spacing:-.01em}
.synth{display:flex;align-items:center;gap:8px;padding:7px 32px;background:var(--warn-soft);border-bottom:1px solid var(--line);color:var(--warn-t);font-size:12.5px;font-weight:550}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 13px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--raised);color:var(--text);font-weight:520;font-size:13px;white-space:nowrap;transition:background var(--dur),border-color var(--dur),transform var(--dur)}
.btn:hover{background:var(--sunken);text-decoration:none;border-color:var(--text-3)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.1);background:var(--accent)}
.btn.ghost{background:none;border-color:transparent;color:var(--text-2)}
.btn.ghost:hover{background:var(--raised);color:var(--text)}
.btn.danger{color:var(--bad-t);border-color:var(--bad-soft)}
.btn.danger:hover{background:var(--bad-soft)}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}
.btn.lg{height:42px;padding:0 20px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:5px}
.field label,.lbl{font-size:12.5px;font-weight:550;color:var(--text-2)}
.field .hint{font-size:12px;color:var(--text-3)}
.field .err{font-size:12.5px;color:var(--bad-t);display:flex;gap:5px;align-items:center}
input[type=text],input[type=email],input[type=password],input[type=tel],input[type=number],input[type=date],select,textarea{width:100%;height:36px;padding:0 11px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--sunken);color:var(--text);font:inherit;transition:border-color var(--dur),box-shadow var(--dur)}
textarea{height:auto;padding:9px 11px;resize:vertical;min-height:84px;line-height:1.5}
input:hover,select:hover,textarea:hover{border-color:var(--text-3)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--hl-line);box-shadow:0 0 0 3px var(--accent-soft)}
input[aria-invalid=true],.field.bad input,.field.bad select,.field.bad textarea{border-color:var(--bad)}
input[type=checkbox],input[type=radio]{accent-color:var(--accent);width:16px;height:16px;margin:0}
.searchin{position:relative}
.searchin .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none}
.searchin input{padding-left:33px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border:1px solid var(--line);border-radius:14px;background:none;color:var(--text-2);font-size:12.5px;font-weight:520}
.chip:hover{border-color:var(--line-2);color:var(--text)}
.chip[aria-pressed=true]{background:var(--accent-soft);border-color:var(--hl-line);color:var(--text)}
.chip .n{font:500 11px var(--mono);color:var(--text-3)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden}
.seg button{border:0;background:none;padding:0 12px;height:30px;color:var(--text-2);font-size:12.5px}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button[aria-pressed=true]{background:var(--accent-soft);color:var(--text);font-weight:550}

/* ---------- badges & status ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:550;white-space:nowrap;background:var(--idle-soft);color:var(--text-2)}
.badge.ok{background:var(--ok-soft);color:var(--ok-t)}.badge.warn{background:var(--warn-soft);color:var(--warn-t)}.badge.bad{background:var(--bad-soft);color:var(--bad-t)}.badge.info{background:var(--accent-soft);color:var(--accent-text)}
.badge .ic{width:12px;height:12px}
.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.tag{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border:1px solid var(--line-2);border-radius:4px;font:500 11.5px var(--mono);color:var(--text-2);background:var(--sunken)}
.aitag{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border:1px dashed var(--line-2);border-radius:11px;background:none;color:var(--text-2);font-size:11.5px}
.aitag:hover{color:var(--accent-text);border-color:var(--hl-line)}

/* ---------- panels & tables ---------- */
.panel{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-lg)}
.panel>.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px var(--pad-card);border-bottom:1px solid var(--line)}
.panel>.ph h2,.ph h3{font-size:13.5px;font-weight:620}
.panel>.pb{padding:var(--pad-card)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gap)}
.split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);overflow:hidden}
.stat{padding:14px 16px;border-right:1px solid var(--line);color:inherit;display:block}
.stat:last-child{border-right:0}
.stat:hover{background:var(--raised);text-decoration:none}
.stat .v{font:600 24px/1.1 var(--font);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .l{font-size:12.5px;color:var(--text-2);margin-top:4px}
.tblwrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:inherit}
th{position:sticky;top:0;background:var(--surface);z-index:2;text-align:left;font-size:12px;font-weight:600;color:var(--text-2);padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
th button{all:unset;cursor:pointer;display:inline-flex;gap:4px;align-items:center}
th button:hover{color:var(--text)}
td{padding:var(--pad-row) 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr[data-href]{cursor:pointer}
tbody tr:hover td{background:var(--raised)}
.idcell{font:500 12.5px var(--mono);white-space:nowrap;color:var(--text)}
.qtext{max-width:64ch}
.sigbar{display:flex;align-items:center;gap:8px;min-width:90px}
.sigbar .bar{flex:1;height:5px;border-radius:3px;background:var(--sunken);overflow:hidden;border:1px solid var(--line)}
.sigbar .bar i{display:block;height:100%;background:var(--accent)}
.sigbar.warn .bar i{background:var(--warn)}.sigbar.bad .bar i{background:var(--bad)}.sigbar.ok .bar i{background:var(--ok)}
.sigbar b{font:500 12px var(--mono);min-width:22px;text-align:right}
.progress{height:6px;background:var(--sunken);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width 350ms var(--ease)}
.note{display:flex;gap:9px;align-items:flex-start;padding:10px 12px;border-radius:var(--r);background:var(--sunken);border:1px solid var(--line);font-size:12.5px;color:var(--text-2)}
.note.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn-t)}
.note .ic{margin-top:2px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:8px 14px;font-size:13px}
.kv dt{color:var(--text-2)}.kv dd{margin:0;min-width:0}

/* ---------- lists ---------- */
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:flex-start;padding:11px var(--pad-card);border-bottom:1px solid var(--line);color:inherit;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0}
.li:last-child{border-bottom:0}
a.li:hover,button.li:hover{background:var(--raised);text-decoration:none}
.li .ic-wrap{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;background:var(--idle-soft);color:var(--text-2);flex:none}
.li .ic-wrap.warn{background:var(--warn-soft);color:var(--warn-t)}.li .ic-wrap.bad{background:var(--bad-soft);color:var(--bad-t)}.li .ic-wrap.ok{background:var(--ok-soft);color:var(--ok-t)}.li .ic-wrap.info{background:var(--accent-soft);color:var(--accent-text)}
.li[aria-current=true]{background:var(--accent-soft)}
.bars .brow{display:grid;grid-template-columns:150px 1fr 44px;gap:12px;align-items:center;padding:7px 0}
.bars .track{height:8px;border-radius:4px;background:var(--sunken);border:1px solid var(--line);overflow:hidden}
.bars .track i{display:block;height:100%;background:var(--accent);transition:width 500ms var(--ease)}

/* ---------- timeline ---------- */
.tl{position:relative;margin:0;padding:0 0 0 22px;list-style:none}
.tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--line-2)}
.tl li{position:relative;padding:0 0 15px}
.tl li::before{content:"";position:absolute;left:-21px;top:5px;width:11px;height:11px;border-radius:50%;background:var(--surface);border:2px solid var(--line-2)}
.tl li.ai::before{border-color:var(--accent)}.tl li.rev::before{border-color:var(--ok);background:var(--ok)}.tl li.warn::before{border-color:var(--warn)}
.tl .t{font:500 12px var(--mono);color:var(--text-3)}
.tl .d{margin-top:1px}
.tl a.evt{display:block;color:inherit;border-radius:var(--r);margin:-4px -8px;padding:4px 8px}
.tl a.evt:hover{background:var(--raised);text-decoration:none}

/* ---------- empty / skeleton / toast ---------- */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:56px 24px;border:1px dashed var(--line-2);border-radius:var(--r-lg);color:var(--text-2)}
.empty h3{color:var(--text);font-size:15px;font-weight:620}
.empty p{max-width:46ch}
.empty .em-ic{width:40px;height:40px;border-radius:10px;background:var(--sunken);border:1px solid var(--line);display:grid;place-items:center;color:var(--text-2);margin-bottom:4px}
.skel{border-radius:6px;background:linear-gradient(90deg,var(--raised),var(--sunken),var(--raised));background-size:200% 100%;animation:sk 1.3s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
#toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:200;pointer-events:none}
.toast{pointer-events:auto;display:flex;gap:10px;align-items:center;min-width:260px;max-width:380px;padding:10px 14px;border-radius:var(--r-lg);background:var(--raised);border:1px solid var(--line-2);box-shadow:var(--shadow);animation:tin 200ms var(--ease)}
.toast.ok .ic{color:var(--ok)}.toast.bad .ic{color:var(--bad)}.toast.warn .ic{color:var(--warn)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}

/* ---------- overlays ---------- */
.scrim{position:fixed;inset:0;background:rgba(4,7,11,.55);z-index:100;display:flex;animation:fin var(--dur) var(--ease)}
[data-theme=light] .scrim{background:rgba(16,24,39,.35)}
@keyframes fin{from{opacity:0}}
.modal{margin:auto;width:min(560px,92vw);max-height:88vh;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-lg);box-shadow:var(--shadow);animation:pop 190ms var(--ease)}
.modal.wide{width:min(1040px,94vw)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.985)}}
.modal>.mh{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal>.mh h2{font-size:15px;font-weight:640}
.modal>.mb{padding:18px;overflow:auto}
.modal>.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.drawer{margin-left:auto;width:min(460px,100vw);height:100%;display:flex;flex-direction:column;background:var(--surface);border-left:1px solid var(--line-2);box-shadow:var(--shadow);animation:din 210ms var(--ease)}
@keyframes din{from{transform:translateX(24px);opacity:0}}
.drawer>.mh{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.drawer>.mb{padding:18px;overflow:auto;flex:1}
.pal{margin:11vh auto auto;width:min(640px,94vw);max-height:70vh;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line-2);border-radius:12px;box-shadow:var(--shadow);animation:pop 170ms var(--ease);overflow:hidden}
.pal input{height:50px;border:0;border-bottom:1px solid var(--line);border-radius:0;background:none;font-size:15px;padding-left:44px}
.pal input:focus{box-shadow:none}
.pal .pi{position:relative}.pal .pi .ic{position:absolute;left:16px;top:16px;color:var(--text-3)}
.pal .res{overflow:auto;padding:6px}
.pal .grp{padding:10px 10px 4px;font-size:11.5px;font-weight:600;color:var(--text-3)}
.pal .it{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:var(--r);color:var(--text);width:100%;border:0;background:none;text-align:left}
.pal .it[aria-selected=true]{background:var(--accent-soft)}
.pal .it .s{margin-left:auto;font:400 11.5px var(--mono);color:var(--text-3)}
.menu{position:absolute;right:0;top:calc(100% + 6px);min-width:240px;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-lg);box-shadow:var(--shadow);z-index:60;padding:6px;animation:pop 150ms var(--ease)}
.menu .mi{display:flex;gap:10px;align-items:center;width:100%;padding:8px 10px;border:0;background:none;border-radius:var(--r);text-align:left;color:var(--text);font-size:13px}
.menu .mi:hover{background:var(--raised);text-decoration:none}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 0}
.rel{position:relative}

/* ---------- landing & auth ---------- */
.landing{min-height:100vh;background:var(--bg);overflow:auto;height:100vh}
.l-top{display:flex;align-items:center;justify-content:space-between;padding:18px 40px}
.hero{max-width:1120px;margin:0 auto;padding:56px 40px 30px;text-align:center}
.hero h1{font-size:clamp(38px,6vw,68px);font-weight:700;letter-spacing:.09em;line-height:1}
.hero .tagline{margin-top:16px;font-size:clamp(17px,2vw,21px);color:var(--text-2);letter-spacing:.02em}
.hero .lede{margin:26px auto 0;max-width:52ch;font-size:16.5px;color:var(--text)}
.hero .ctas{margin-top:28px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.trace-demo{max-width:1020px;margin:36px auto 0;padding:0 40px}
.trace-demo .stage{position:relative;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:28px 28px 22px;text-align:left;overflow:hidden}
.trace-demo .tag-syn{position:absolute;top:10px;right:14px}
.td-grid{display:grid;grid-template-columns:1.15fr 1fr;gap:38px;align-items:center}
.td-claim{font:var(--serif);font-family:var(--serif);font-size:19px;line-height:1.55}
.td-claim mark{background:var(--hl);color:inherit;border-bottom:2px solid var(--hl-line);padding:1px 0;border-radius:2px;animation:hlin 1.2s .5s both var(--ease)}
@keyframes hlin{from{background:transparent;border-bottom-color:transparent}}
.td-src{margin-top:16px;font:500 12px var(--mono);color:var(--text-2)}
.td-ev{display:flex;flex-direction:column;gap:9px}
.td-ev .e{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--sunken);animation:eIn .5s both var(--ease)}
.td-ev .e:nth-child(2){animation-delay:.9s}.td-ev .e:nth-child(3){animation-delay:1.2s}.td-ev .e:nth-child(4){animation-delay:1.5s}
@keyframes eIn{from{opacity:0;transform:translateX(10px)}}
.td-ev .e.c{border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.flow{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;margin:26px 0 0;color:var(--text-2);font-size:13px;font-weight:550}
.flow span.s{padding:5px 12px;border:1px solid var(--line-2);border-radius:14px;background:var(--surface)}
.section{max-width:1020px;margin:0 auto;padding:54px 40px 10px}
.section h2{font-size:24px;font-weight:650;letter-spacing:-.02em;margin-bottom:8px}
.how{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:26px;border-top:1px solid var(--line-2)}
.how>div{padding:18px 18px 4px 0}
.how h3{font-size:14.5px;font-weight:620;margin:6px 0 5px}
.how p{font-size:13.5px;color:var(--text-2)}
.disc{max-width:1020px;margin:44px auto 0;padding:22px 40px 50px;color:var(--text-2);font-size:13px;border-top:1px solid var(--line)}
.authwrap{min-height:100vh;height:100vh;overflow:auto;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);background:var(--bg)}
.auth-side{padding:40px 48px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:space-between;gap:30px}
.auth-side h2{font-size:26px;font-weight:650;letter-spacing:-.02em;line-height:1.2;max-width:16ch}
.auth-side ul{list-style:none;padding:0;margin:22px 0 0;display:flex;flex-direction:column;gap:14px;color:var(--text-2);font-size:13.5px}
.auth-side li{display:flex;gap:11px}
.auth-form{padding:44px 40px;display:flex;align-items:flex-start;justify-content:center}
.auth-form form{width:min(520px,100%)}
.auth-form h1{font-size:22px;font-weight:650;letter-spacing:-.02em}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fgrid .full{grid-column:1/-1}
.fsec{margin:22px 0 10px;font-size:13px;font-weight:620;padding-bottom:7px;border-bottom:1px solid var(--line)}

/* ---------- claim detail: the rail ---------- */
.trace{display:flex;gap:0;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);overflow:hidden;margin-bottom:22px}
.trace a{flex:1;padding:10px 14px;border-right:1px solid var(--line);color:inherit;min-width:0;display:block}
.trace a:last-child{border-right:0}
.trace a:hover{background:var(--raised);text-decoration:none}
.trace .k{font-size:12px;color:var(--text-2);display:flex;align-items:center;gap:6px}
.trace .v{font:600 15px var(--font);margin-top:2px;font-variant-numeric:tabular-nums}
.trace a.on .k{color:var(--text)}
.trace a.flag .v{color:var(--warn-t)}.trace a.bad .v{color:var(--bad-t)}
.rail{position:relative;padding-left:30px}
.rail::before{content:"";position:absolute;left:8px;top:8px;bottom:8px;width:1px;background:var(--line-2)}
.station{position:relative;margin-bottom:30px;scroll-margin-top:90px}
.station::before{content:"";position:absolute;left:-27px;top:4px;width:11px;height:11px;border-radius:50%;background:var(--bg);border:2px solid var(--accent)}
.station.warn::before{border-color:var(--warn)}.station.bad::before{border-color:var(--bad)}.station.ok::before{border-color:var(--ok);background:var(--ok)}
.station>h2{font-size:15px;font-weight:650;letter-spacing:-.01em;margin-bottom:3px}
.station>.q{font-size:12.5px;color:var(--text-2);margin-bottom:12px}
.claimtxt{font-size:19px;line-height:1.45;font-weight:520;letter-spacing:-.012em;max-width:62ch}
.passage{font-family:var(--serif);font-size:15.5px;line-height:1.65;padding:14px 16px;border:1px solid var(--line);border-left:3px solid var(--hl-line);background:var(--paper);color:var(--paper-text);border-radius:0 var(--r) var(--r) 0}
.passage mark,.sheet mark.cl{background:var(--hl);color:inherit;border-radius:2px;padding:1px 0}
.evrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);align-items:start}
.evrow+.evrow{margin-top:8px}
.evrow.c{border-left:3px solid var(--bad)}.evrow.s{border-left:3px solid var(--ok)}.evrow.x{border-left:3px solid var(--line-2)}
.mini{width:100%;height:auto;display:block}
.mini text{font-family:var(--font);fill:var(--text)}
.mini .mono{font-family:var(--mono)}
.sigrow{display:grid;grid-template-columns:130px 1fr 56px;gap:10px;align-items:center;padding:5px 0}
.factors{margin:8px 0 0;padding:0;list-style:none;font-size:12.5px;color:var(--text-2);display:flex;flex-direction:column;gap:3px}
.factors li{display:flex;justify-content:space-between;gap:10px}
.sticky-side{position:sticky;top:86px;display:flex;flex-direction:column;gap:16px}
.radio{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r);cursor:pointer;background:var(--sunken)}
.radio:hover{border-color:var(--line-2)}
.radio:has(input:checked){border-color:var(--hl-line);background:var(--accent-soft)}
.radio b{font-weight:580;display:block}
.radio small{color:var(--text-2);font-size:12px}

/* ---------- document viewer ---------- */
.dv{display:grid;grid-template-columns:250px minmax(0,1fr) 340px;height:calc(100vh - var(--top-h) - 62px);min-height:520px}
.dv>*{min-height:0;overflow:auto}
.dv-l{border-right:1px solid var(--line);background:var(--surface)}
.dv-r{border-left:1px solid var(--line);background:var(--surface)}
.dv-c{background:var(--sunken);padding:0;display:flex;flex-direction:column;overflow:hidden}
.dv-bar{display:flex;align-items:center;gap:10px;padding:9px 18px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.dv-scroll{overflow:auto;flex:1;padding:26px 24px 60px}
.sheet{max-width:760px;margin:0 auto;background:var(--paper);color:var(--paper-text);border:1px solid var(--line);border-radius:4px;padding:44px 52px;font-family:var(--serif);font-size:16.5px;line-height:1.75;box-shadow:var(--shadow);position:relative}
.sheet .pn{position:absolute;top:12px;right:18px;font:500 11px var(--mono);color:var(--text-3)}
.sheet p{margin:0 0 1.05em;position:relative;padding-left:0}
.sheet p .gut{position:absolute;left:-40px;top:.28em;font:500 10.5px var(--mono);color:var(--text-3);user-select:none}
.sheet mark.cl{cursor:pointer;background:transparent;border-bottom:1.5px solid var(--line-2);transition:background var(--dur)}
.sheet mark.cl:hover{background:var(--hl)}
.sheet mark.cl.rv{border-bottom-color:var(--ok)}.sheet mark.cl.cf{border-bottom-color:var(--bad)}
.sheet mark.cl.focus{background:var(--hl);border-bottom:2px solid var(--hl-line);animation:flash 1.4s var(--ease)}
@keyframes flash{0%{background:var(--warn-soft);box-shadow:0 0 0 6px var(--warn-soft)}100%{box-shadow:0 0 0 0 transparent}}
.sheet mark.q{background:#e8c53a66;color:inherit;border-radius:2px}
.sheet .sp{font:600 12px var(--font);color:var(--accent-text);display:block;letter-spacing:.01em}
.sheet .ts{font:500 11.5px var(--mono);color:var(--text-3);margin-right:8px}
.dv-doc{display:flex;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0;color:inherit;align-items:flex-start}
.dv-doc:hover{background:var(--raised);text-decoration:none}
.dv-doc[aria-current=true]{background:var(--accent-soft);box-shadow:inset 3px 0 var(--accent)}
.dv-h{padding:12px 14px 6px;font-size:12px;font-weight:600;color:var(--text-3)}
.cardbtn{display:block;width:100%;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--sunken);color:inherit;margin-bottom:8px}
.cardbtn:hover{border-color:var(--line-2);text-decoration:none;background:var(--raised)}
.cardbtn[aria-current=true]{border-color:var(--hl-line);background:var(--accent-soft)}
body.focus .sidebar,body.focus .topbar,body.focus .casehead,body.focus .synth,body.focus .dv-l,body.focus .dv-r,body.focus .bottomnav{display:none!important}
body.focus .app{grid-template-columns:1fr;grid-template-rows:1fr}
body.focus .dv{grid-template-columns:1fr;height:100vh}
body.focus .dv-c{background:var(--bg)}
body.focus .sheet{font-size:18px;max-width:820px}
.focusexit{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:90}
body.focus .focusexit{display:inline-flex}.focusexit{display:none}

/* ---------- hearing ---------- */
.hv{display:grid;grid-template-columns:210px minmax(0,1fr) 330px;gap:0;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);overflow:hidden;height:calc(100vh - var(--top-h) - 250px);min-height:420px}
.hv>*{overflow:auto;min-height:0}
.hv>*+*{border-left:1px solid var(--line)}
.stmt{display:grid;grid-template-columns:78px minmax(0,1fr);gap:12px;padding:12px 18px;border-bottom:1px solid var(--line)}
.stmt.q{background:var(--sunken)}
.stmt .who{font-size:12.5px;font-weight:600}
.stmt .body{font-family:var(--serif);font-size:15.5px;line-height:1.6}
.stmt.focus{background:var(--accent-soft);box-shadow:inset 3px 0 var(--hl-line);animation:flash 1.4s var(--ease)}
.tlbar{margin-top:14px;padding:14px 18px 8px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface)}
.tlbar svg{width:100%;height:96px;display:block}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--text-2);margin-top:6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:baseline}
.drop{display:flex;flex-direction:column;align-items:center;gap:10px;padding:34px 20px;border:1.5px dashed var(--line-2);border-radius:var(--r-lg);text-align:center;background:var(--surface);transition:border-color var(--dur),background var(--dur)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.upl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.steps{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--text-3)}
.steps .done{color:var(--ok-t)}.steps .now{color:var(--accent-text)}.steps .err{color:var(--bad-t)}
.steps span{display:inline-flex;align-items:center;gap:5px}

/* ---------- pipeline ---------- */
.pipe{display:flex;flex-direction:column}
.stage{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);align-items:center}
.stage:last-child{border-bottom:0}
.stage .si{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line-2);color:var(--text-3)}
.stage.done .si{background:var(--ok-soft);border-color:var(--ok);color:var(--ok-t)}
.stage.run .si{border-color:var(--accent);color:var(--accent-text);background:var(--accent-soft)}
.stage.find .si{background:var(--warn-soft);border-color:var(--warn);color:var(--warn-t)}
.stage.fail .si{background:var(--bad-soft);border-color:var(--bad);color:var(--bad-t)}
.toolgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.tool{padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--sunken);text-align:left;color:inherit}
.tool:hover{border-color:var(--line-2)}

/* ---------- graph ---------- */
.gwrap{position:relative;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--sunken);overflow:hidden;height:calc(100vh - 300px);min-height:520px;background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:22px 22px}
.gwrap svg.g{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
.gwrap svg.g.drag{cursor:grabbing}
.gnode{cursor:pointer}
.gnode rect.b{fill:var(--surface);stroke:var(--line-2);stroke-width:1;transition:stroke var(--dur),filter var(--dur)}
.gnode:hover rect.b{stroke:var(--text-3)}
.gnode.sel rect.b{stroke:var(--hl-line);stroke-width:2;filter:drop-shadow(0 0 6px var(--hl))}
.gnode text{fill:var(--text);font:500 11.5px var(--font);pointer-events:none}
.gnode text.id{font:600 11px var(--mono)}
.gnode text.sub{fill:var(--text-2);font-size:10.5px}
.gnode.dim,.gedge.dim{opacity:.16}
.gnode.hit rect.b{stroke:var(--warn);stroke-width:2}
.gedge path{fill:none;stroke-width:1.4;transition:opacity var(--dur)}
.gedge path.hit{stroke:transparent;stroke-width:12;cursor:pointer}
.gedge.sel path.v{stroke-width:2.6}
.gedge text{font:600 9.5px var(--mono);fill:var(--text-2);paint-order:stroke;stroke:var(--sunken);stroke-width:3px}
.gtools{position:absolute;top:12px;left:12px;display:flex;flex-direction:column;gap:6px;z-index:5;max-width:min(330px,60%)}
.gtools .box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:9px;display:flex;flex-direction:column;gap:8px}
.gzoom{position:absolute;bottom:12px;left:12px;display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:3px;z-index:5}
.gmini{position:absolute;bottom:12px;right:12px;width:170px;height:110px;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);z-index:5;overflow:hidden}
.gpanel{position:absolute;top:0;right:0;bottom:0;width:340px;background:var(--surface);border-left:1px solid var(--line);z-index:6;overflow:auto;padding:16px;animation:din 200ms var(--ease)}
.gwrap.hasp .gmini{right:352px}
.gleg{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11.5px;color:var(--text-2)}
.gleg i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}

/* ---------- compare ---------- */
.cmp{display:grid;grid-template-columns:1fr 46px 1fr;gap:0;align-items:stretch}
.cmp .side{border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;background:var(--sunken);min-width:0}
.cmp .mid{display:grid;place-items:center;color:var(--bad-t)}
.cmpbanner{margin-top:14px;text-align:center;padding:12px;border:1px solid var(--bad-soft);background:var(--bad-soft);color:var(--bad-t);border-radius:var(--r);font-weight:600}

/* ---------- report ---------- */
.rpt{max-width:820px;margin:0 auto;background:var(--paper);color:var(--paper-text);border:1px solid var(--line);border-radius:4px;padding:44px 54px;font-family:var(--serif);font-size:14.5px;line-height:1.6}
.rpt h2{font:650 15px var(--font);margin:26px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--line-2);color:var(--paper-text)}
.rpt h1{font:700 22px var(--font);margin-bottom:4px}
.rpt table{font-size:12.5px;font-family:var(--font)}
.rpt th{position:static;background:none;color:var(--text-2)}.rpt td{padding:6px 10px}
.bottomnav{display:none}
.scrollx{overflow-x:auto}

/* ---------- responsive ---------- */
@media (max-width:1280px){
  .dv{grid-template-columns:230px minmax(0,1fr)}.dv-r{display:none}
  .hv{grid-template-columns:190px minmax(0,1fr)}.hv>:nth-child(3){display:none}
  .split{grid-template-columns:minmax(0,1fr)}
  .sticky-side{position:static}
  .stats{grid-template-columns:repeat(3,1fr)}.stat:nth-child(3){border-right:0}.stat:nth-child(-n+3){border-bottom:1px solid var(--line)}
}
@media (max-width:980px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:var(--top-h);bottom:0;width:270px;z-index:50;transform:translateX(-100%);transition:transform 200ms var(--ease);box-shadow:var(--shadow)}
  .app.navopen .sidebar{transform:none}
  .app.collapsed{--sb-w:256px}
  .app.collapsed .navitem span,.app.collapsed .navgroup,.app.collapsed .sb-case,.app.collapsed .navitem .badge-n{display:revert}

  if (k === 'Escape') { if ($('#overlay').innerHTML) { closeOverlay(); return; } if (document.body.classList.contains('focus')) { document.body.classList.remove('focus'); return; } $$('.menu').forEach(m => m.remove()); }

  const typing = /INPUT|TEXTAREA|SELECT/.test((document.activeElement || {}).tagName || '');

async function startAnalysis(caseId) {
  const u = currentUser(); let C; try { C = CaseSvc.get(u.id, caseId); } catch (e) { return toast('Unable to load case. Try again.', 'bad'); }
  if (!C.documents.length) { toast('Add at least one document or transcript before analyzing.', 'warn'); go(caseHref(C, 'documents')); return; }
  toast('Analysis started.', 'ok'); go(caseHref(C, 'analysis'));
  try { const a = await Data.analyze(caseId); const st = a && a.status; toast(st === 'completed' ? 'Analysis completed.' : st === 'partial' ? 'Analysis finished with some stages incomplete.' : 'Analysis did not complete.', st === 'completed' ? 'ok' : 'warn'); }
  catch (e) { toast(e && e.message ? e.message : 'Analysis could not start.', 'bad'); }
  if (UI.R && UI.R.parts[0] === 'cases' && UI.R.parts[1] === caseId) render();
}

  const infos = C.claims.map(c => X.info(c)); const signals = [[m.conflicts, 'potential conflicts', 'conflicts', 'bad'], [infos.filter(i => i.status === 'NEEDS_REVIEW' || i.status === 'NEEDS_VERIFICATION').length, 'claims requiring verification', 'claims', 'warn'], [C.citations.filter(x => x.result !== 'POTENTIALLY_RELEVANT').length, 'citations requiring review', 'citations', 'warn'], [infos.filter(i => i.unresolved).length, 'unresolved evidence relationships', 'claims', 'idle']];

/* ---------- authority library + research ---------- */
function authForm() {

  <div class="toolgrid" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr))">${MCP_TOOL_NAMES.map(n => { const t = MCP.tools[n]; const cs = calls.filter(c => c.tool === n); const last = cs.length ? cs.reduce((a, b) => a.ts > b.ts ? a : b) : null; const er = errs.filter(e => e.tool === n).length; return `<button class="tool" data-act="mcp-open" data-tool="${n}" data-case="${q.case || ''}"><div class="row between"><span class="mono" style="font-weight:600">${n}</span><span class="badge ok">${icon('check', 12)}Available</span></div><div class="muted" style="font-size:12.5px;margin:6px 0 10px">${esc(trunc(t.purpose, 96))}</div><dl class="kv" style="grid-template-columns:78px 1fr;font-size:12px;gap:3px 8px"><dt>Access</dt><dd>${n === 'search_authorities' || n === 'get_authority_excerpt' ? 'Your library' : 'Case-scoped'}</dd><dt>Last used</dt><dd class="mono">${last ? esc(fmtDT(last.ts)) : 'Never'}</dd><dt>Requests</dt><dd class="mono">${cs.length}</dd><dt>Errors</dt><dd class="mono">${er} <span class="faint">this session</span></dd></dl></button>`; }).join('')}</div>

  if (p0 === 'lawyer-profile') return u.role === 'LAWYER' ? LawyerProfileView() : blockedView('Only lawyers have a directory profile.');

const HSTATUS = { SCHEDULED: ['info', 'cal', 'Scheduled'], IN_PROGRESS: ['warn', 'mic', 'In progress'], COMPLETED: ['ok', 'check', 'Completed'], ADJOURNED: ['idle', 'clock', 'Adjourned'], CANCELLED: ['idle', 'x', 'Cancelled'] };
const hBadge = s => badge(s, null, HSTATUS);
const toLocalInput = iso => { const d = new Date(iso); return isNaN(d) ? '' : `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; };

async function twInit(C, h, write) {
